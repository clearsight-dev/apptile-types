# -----------------------------------------------------------------------------
# Reference cloudbuild.yaml — npm package (tile-packet-*, apptile-types)
# -----------------------------------------------------------------------------
# Copy this file into an npm-package repo's root as `cloudbuild.yaml`. The
# package's `package.json` is expected to declare:
#
#   "publishConfig": {
#     "registry": "https://us-central1-npm.pkg.dev/PROJECT_ID/tile-packet-npm/"
#   }
#
# On `main`: builds → publishes to the `latest` dist-tag, using the version
#            from package.json (bump before merging).
# On `scion/*`: publishes to `scion` dist-tag with a `-scion.<sha>` version
#               suffix so consumers can opt in without disturbing `latest`.
# -----------------------------------------------------------------------------

steps:
  # 1. Grab a short-lived OAuth token from the CB SA and inject it into
  #    .npmrc under the GAR-npm registry key so `npm publish` in step 2
  #    can auth against Artifact Registry directly (google-artifactregistry-auth
  #    was silently writing to the wrong .npmrc).
  - id: npm-auth
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -euc
      - |
        TOKEN=$$(gcloud auth print-access-token)
        # ONLY the auth-token line — no `registry=` default (that would
        # route every `npm install` dep through GAR-npm and 404). The
        # publishConfig in package.json is what directs `npm publish` to
        # GAR-npm; installs continue to use the public registry.
        cat > .npmrc <<NPMRC
        //us-central1-npm.pkg.dev/${PROJECT_ID}/tile-packet-npm/:_authToken=$$TOKEN
        //us-central1-npm.pkg.dev/${PROJECT_ID}/tile-packet-npm/:always-auth=true
        NPMRC

  - id: build-publish
    name: node:20.19.4
    entrypoint: bash
    args:
      - -euc
      - |

        # Install without running lifecycle scripts (safety), then build.
        # `--legacy-peer-deps` matches the local-dev flag used across the
        # tile-packet-* repos (their peer deps predate npm 7's ERESOLVE).
        if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
          npm ci --no-audit --no-fund --ignore-scripts --legacy-peer-deps
        else
          npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps
        fi
        if npm run | grep -qE '^\s*build\b'; then
          npm run build
        fi

        if [[ "${BRANCH_NAME}" == "main" ]]; then
          # Idempotent publish: query GAR-npm explicitly (npm view without
          # --registry hits the public registry, which never has our
          # packages). Bump the version in a commit for a new release.
          REG="https://us-central1-npm.pkg.dev/${PROJECT_ID}/tile-packet-npm/"
          pkg_name=$$(node -p "require('./package.json').name")
          pkg_ver=$$(node -p "require('./package.json').version")
          if npm view --registry="$$REG" "$${pkg_name}@$${pkg_ver}" version >/dev/null 2>&1; then
            echo "→ $${pkg_name}@$${pkg_ver} already published; skipping"
          else
            npm publish --tag latest
          fi
        else
          # Scion branches: append `-scion.<sha>` to the version and
          # publish under the `scion` dist-tag so consumers can opt in
          # without disturbing `latest`. $$ escapes bash-side vars — CB
          # expands ${SHORT_SHA} at yaml-parse time.
          base=$$(node -e "console.log(require('./package.json').version)")
          scion_version="$${base}-scion.${SHORT_SHA}"
          npm --no-git-tag-version version "$$scion_version"
          npm publish --tag scion
        fi

timeout: 900s
options:
  # Default machine (e2-standard-2) is fine for npm publish — machineType
  # only accepts N1_HIGHCPU_{8,32} / E2_HIGHCPU_{8,32}; omit for the default.
  logging: CLOUD_LOGGING_ONLY
